<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio Pereka Designomik - Permainan Interaktif PSV</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbe1',
                            100: '#fff3b8',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                        },
                        art: {
                            purple: '#7c3aed',
                            pink: '#ec4899',
                            blue: '#0284c7',
                            teal: '#0d9488',
                            green: '#16a34a'
                        }
                    },
                    fontFamily: {
                        heading: ['Fredoka', 'sans-serif'],
                        body: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #fef3c7 100%);
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .font-heading {
            font-family: 'Fredoka', cursive, sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
        }
        .bounce-hover:hover, .bounce-hover:active {
            transform: translateY(-2px) scale(1.01);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .glow-gold {
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen pb-10 select-none">

    <!-- Navigation Header -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-6xl mx-auto px-3 sm:px-4 py-2.5 sm:py-3 flex items-center justify-between">
            <div class="flex items-center gap-2 sm:gap-3">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-pink-500 flex items-center justify-center text-white text-lg sm:text-xl font-bold shadow-md shrink-0">
                    <i class="fa-solid fa-palette"></i>
                </div>
                <div>
                    <h1 class="font-heading font-bold text-base sm:text-lg md:text-xl text-slate-800 leading-none">
                        STUDIO DESIGNOMIK
                    </h1>
                    <p class="text-[10px] sm:text-xs text-slate-500 font-medium">PSV Tingkatan 1 • Tajuk 17</p>
                </div>
            </div>

            <!-- Header Controls & Score -->
            <div class="flex items-center gap-1.5 sm:gap-4">
                <button onclick="toggleAudio()" id="audioBtn" class="p-2 sm:p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 transition" title="Mute/Unmute Bunyi">
                    <i class="fa-solid fa-volume-high text-base sm:text-lg"></i>
                </button>
                <button onclick="openModal('notaModal')" class="flex items-center gap-1.5 px-2.5 py-2 sm:px-3 sm:py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-semibold text-xs sm:text-sm shadow-sm transition">
                    <i class="fa-solid fa-book-open"></i>
                    <span class="hidden sm:inline">Ulang Kaji Nota</span>
                </button>
                <div class="bg-amber-50 border border-amber-200 rounded-xl px-2.5 py-1 sm:px-3 sm:py-1.5 flex items-center gap-1.5 sm:gap-2">
                    <i class="fa-solid fa-star text-amber-500 text-base sm:text-lg"></i>
                    <div>
                        <div class="text-[9px] sm:text-[10px] uppercase font-extrabold text-amber-700 tracking-wider">Mata</div>
                        <div id="headerScore" class="font-heading font-bold text-sm sm:text-base text-slate-800 leading-none">0</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-5xl mx-auto px-3 sm:px-4 pt-4 sm:pt-6 flex-grow w-full">

        <!-- Progress Tracker Bar -->
        <div class="mb-4 sm:mb-6 glass-card rounded-2xl p-3 sm:p-4">
            <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-slate-500">Kemajuan Cabaran</span>
                <span id="
